# Nginx：托管前端静态文件，/api、/media、/resume 反代到后端容器。
# 入口粗限流先于数据库访问；具体问答配额由后端共享存储执行。
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=5r/s;
limit_req_zone $server_name zone=api_global:1m rate=30r/s;
limit_req_zone $binary_remote_addr zone=stop_per_ip:1m rate=2r/s;

server {
    listen 80 default_server;
    server_name _;
    client_max_body_size 1m;

    root /usr/share/nginx/html;
    index index.html;

    # 只压缩静态资源；text/event-stream 不在列表里，SSE 不会被 gzip 缓冲。
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 安全响应头。location 里一旦写了 add_header 就不再继承这里的，所以下面两处重复列出。
    # 配好 HTTPS 后可再加：add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/chat {
        limit_req zone=api_per_ip burst=10 nodelay;
        limit_req zone=api_global burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 关键配置：不缓冲、不压缩、超时拉长。
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
    }

    # 用完普通请求额度后仍能停止生成；归属校验与跨实例停止由后端执行。
    location = /api/chat/stop {
        limit_req zone=stop_per_ip burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location ~ ^/(api|media|resume)/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        limit_req zone=api_global burst=50 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
