# 生产 / 测试环境编排。用法见 docs/deploy-aliyun.md，推荐直接 bash scripts/deploy.sh。
# 手动执行：docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: resume-agent-prod

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-resume}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env.production 里设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-resume}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 不映射端口，5432 只在 compose 内部网络可见。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: resume-agent-backend:latest
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-resume}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-resume}
      PORT: "8787"
      TRUST_PROXY: "1"
      CHAT_MOCK: "0"
    depends_on:
      db:
        condition: service_healthy
    # 启动时自动执行幂等迁移（server.js 内置）。入库由 deploy.sh 调用 ingest。
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: resume-agent-web:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
